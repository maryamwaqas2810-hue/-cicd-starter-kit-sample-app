name: SafeX CI/CD Starter Kit Pipeline

on:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Start app in background
        run: npm start &

      - name: Wait for app to be ready
        run: sleep 3

      - name: Run tests (failing-test gate)
        run: npm test

      - name: Deploy (simulated)
        if: success()
        run: echo "All tests passed. Deploying app now..."
